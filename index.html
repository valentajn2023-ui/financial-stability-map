        <div class="start-copy">
          <p>За 5–10 минут соберём несколько ключевых цифр, посмотрим вашу текущую финансовую ситуацию и разберём только то, что действительно актуально именно для вас.</p>
          <p>В конце вы получите персональную карту и практические рекомендации по следующим шагам.</p>

    case 'about': h=`<section class="about-slide" aria-label="О Валентине Лебединском"><div class="about-copy"><div class="about-name">Валентин Лебединский</div><div class="about-rule"></div><h1 class="about-title">Обо мне</h1><div class="about-text"><p>Привет! Меня зовут Валентин. Я занимаюсь финансовым планированием и помогаю людям наводить порядок в личных финансах, отслеживать расходы, выстраивать накопления и защиту, определять цели и составлять понятный план действий.</p><p>Для меня важно не начинать с готового продукта. Сначала нужно понять, где человек находится сейчас, чего хочет достичь, что для него важно сохранить и какие финансовые риски стоит учитывать.</p><p>У каждого своя задача. Кто-то хочет накопить капитал, кто-то защитить семью, кто-то разобраться с расходами и начать увереннее управлять деньгами. Поэтому я за простой и понятный подход без сложных терминов и лишней теории.</p><p>Моя задача в том, чтобы помочь человеку увидеть всю картину целиком: что есть сейчас, куда он хочет прийти и какие шаги для этого можно сделать.</p><p>Финансовая устойчивость для меня начинается с ясности, системы и решений, которые подходят конкретному человеку и его жизни.</p></div></div><div class="about-photo"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAMCAgMCAgMDAwMEAwMEBQgFBQQEBQoHBwYIDAoMDAsKCwsNDhIQDQ4RDgsLEBYQERMUFRUVDA8XGBYUGBIUFRT/2wBDAQMEBAUEBQkFBQkUDQsNFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBT/wAARCARlA4QDASIAAhEBAxEB/8QAHQAAAQUBAQEBAAAAAAAAAAAAAgABAwQFBgcICf/EAEYQAAIBAwIEBQEGBAUEAQMBCQECAwAEERIhBTFBUQYTImFxgQcUMkKRoSOxwdEVM1Lh8AgkYvFyFlOCkjRDssIXoiUmVP/EABwBAQEAAwEBAQEAAAAAAAAAAAABAgMEBQYHCP/EADYRAQACAgICAQMDAwIFAgcAAAABAgMRITEEEkEFE1EiMmEGFHGRsSMzQlLBFdEkQ4Gh4fDx/9oADAMBAAIRAxEAPwD8/QN6JRTKMdadTua9V8+IjvTge9Inl3pY2xRBZ5jlQ4zjNPSzUQxHOkafnTYAoyOMdac47UgM9aRG3eqhZHLpUijAqLGKkHL2omj5702M0+xzTcvaqh+XKmA3HenG+aILRBLsKc0hSIoAI3olGRvS04FGq71UDnHOiAxzO1OV3702nfnQED2ohtvQ8qMdKqG05pwBmnwMU6jnmiG6U60XOm0mgNTk0jg7ihAIHf6     case 'context': h=wrap('Что вы хотите понять или улучшить в своих финансах сейчас?','Если конкретного запроса пока нет — можно оставить поле пустым и пройти диагностику.',`
      <div class="field"><textarea id="whyNow" placeholder="Например: понять, хватает ли резерва; быстрее разобраться с кредитами; проверить финансовую защиту; составить личный финансовый план; рассчитать капитал или конкретную финансовую цель">${esc(state.whyNow)}</textarea><div class="helper">Можно коротко, своими словами. Поле необязательное.</div></div>
      <div class="divider"></div>
      <div class="context-section-title">Немного о вас</div>
      <div class="identity-grid"><div class="field"><label class="title">Как к вам обращаться?</label><input id="clientName" type="text" value="${esc(state.clientName||'')}" placeholder="Имя"></div>${numberInput('age','Возраст, лет',state.age,'','Например, 38')}</div>
      <div class="contact-grid"><div class="field"><label class="title">Где мы с вами на связи?</label><select id="contactChannel"><option value="">Выберите...</option><option value="telegram" ${state.contactChannel==='telegram'?'selected':''}>Telegram</option><option value="vk" ${state.contactChannel==='vk'?'selected':''}>ВКонтакте</option><option value="instagram" ${state.contactChannel==='instagram'?'selected':''}>Instagram</option><option value="whatsapp" ${state.contactChannel==='whatsapp'?'selected':''}>WhatsApp</option><option value="phone" ${state.contactChannel==='phone'?'selected':''}>Телефон</option><option value="known" ${state.contactChannel==='known'?'selected':''}>Мы уже на связи / контакт известен Валентину</option></select></div><div class="field" id="contactValueBox"><label class="title">Контакт</label><input id="contactValue" type="text" value="${esc(state.contactValue||'')}" placeholder="Например, @username или номер телефона"></div></div>`,'Ваш запрос'); break;

function wireDynamic(){
  const wireOther=(group,boxId)=>{const box=document.getElementById(boxId);if(!box)return;const apply=()=>box.classList.toggle('hidden',![...document.querySelectorAll(`input[name="${group}"]:checked`)].some(x=>x.value==='other'));document.querySelectorAll(`input[name="${group}"]`).forEach(x=>x.addEventListener('change',apply));apply()};
  if(current==='context'){const sel=document.getElementById('contactChannel'),box=document.getElementById('contactValueBox');const apply=()=>{if(!sel||!box)return;box.style.opacity=sel.value==='known'?'.45':'1';document.getElementById('contactValue').disabled=sel.value==='known'};sel?.addEventListener('change',apply);apply();}
  wireOther('workType','workTypeOtherBox');wireOther('resources','resourcesOtherBox');wireOther('insuranceTypes','insuranceOtherBox');wireOther('tools','toolsOtherBox');wireOther('expenseCategories','expenseCategoryOtherBox');wireOther('selectionCriteria','selectionCriteriaOtherBox');wireOther('businessRisks','businessRiskOtherBox');
  if(current==='protection_gate'){
    const box=document.getElementById('protectionTypesBox');
    const radios=[...document.querySelectorAll('input[name="protectionGate"]')];
    const apply=()=>{const yes=radios.some(x=>x.checked&&x.value==='yes');if(box)box.classList.toggle('hidden',!yes);if(yes)wireOther('insuranceTypes','insuranceOtherBox');};
    radios.forEach(x=>x.addEventListener('change',apply));apply();
  }
  if(current==='family_status'){
    const deps=[...document.querySelectorAll('input[name="dependents"]')];
    deps.forEach(x=>x.addEventListener('change',()=>{
      if(!x.checked)return;
      if(x.value==='none') deps.forEach(y=>{if(y!==x)y.checked=false});
      else {const none=deps.find(y=>y.value==='none');if(none)none.checked=false;}
    }));
  }
  if(current==='priority'){
    const boxes=[...document.querySelectorAll('input[name="helpTopics"]')],rankBox=document.getElementById('priorityRanking');
    const readRankMap=()=>Object.fromEntries([...document.querySelectorAll('[id^="helpTopicRank_"]')].map(x=>[x.dataset.topic,Number(x.value)]));
    const wireRanks=()=>{
      const sels=[...document.querySelectorAll('[id^="helpTopicRank_"]')];
      sels.forEach(sel=>sel.addEventListener('change',()=>{const prev=Number(sel.dataset.prev),next=Number(sel.value);const other=sels.find(x=>x!==sel&&Number(x.value)===next);if(other){other.value=String(prev);other.dataset.prev=String(prev)}sel.dataset.prev=String(next)}));
    };
    const redraw=(changed)=>{let selected=boxes.filter(x=>x.checked);if(selected.length>3){if(changed)changed.checked=false;notify('Можно выбрать не больше трёх тем');selected=boxes.filter(x=>x.checked)}const rankMap=readRankMap();if(rankBox)rankBox.innerHTML=priorityRankingMarkup(selected.map(x=>x.value),rankMap);wireRanks();};
    boxes.forEach(x=>x.addEventListener('change',()=>redraw(x)));wireRanks();
  }
}

*{box-sizing:border-box}html,body{margin:0;padding:0}.gift-export-page{position:relative;width:${GIFT_EXPORT_WIDTH}px;height:${GIFT_EXPORT_HEIGHT}px;background:#fff;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#17243a}.gift-export-content{position:absolute;left:0;top:0;width:${GIFT_EXPORT_CONTENT_WIDTH}px;transform-origin:top left;background:#fff;padding:28px 32px 24px}.gift-export-meta{font-size:11px;color:#7a8797;margin-bottom:8px}.gift-export-title{font-size:34px;line-height:1.08;margin:0;color:#10203e}.gift-export-subtitle{font-size:15px;line-height:1.45;color:#5c6e84;margin:8px 0 22px}.financial-map-gift{border:1px solid #cfdff2;background:linear-gradient(135deg,#f7faff,#fff);border-radius:18px;padding:22px}.financial-map-gift h2{font-size:28px;line-height:1.08;margin:0 0 6px}.financial-map-gift .subtitle{font-weight:750;color:#375b87;margin:0 0 10px}.financial-map-gift p{font-size:14.5px;line-height:1.48;color:#43556f}.financial-map-gift .plan-step{padding:13px 0;border-top:1px solid #dce5f0}.financial-map-gift .plan-step:first-of-type{margin-top:12px}.financial-map-gift .plan-step h3{font-size:16px;line-height:1.25;margin:0 0 5px;color:#17243a}.financial-map-gift .plan-step p{margin:0}.financial-map-gift .next-step{background:#eef4fb;border-radius:14px;padding:14px 16px;margin-top:14px}.financial-map-gift .next-step h3{font-size:16px;margin:0 0 5px}.financial-map-gift .next-step p{margin:0}.financial-map-gift .guide-note{font-size:11px;color:#66778d;margin-top:10px}.gift-export-footer{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:16px;padding-top:10px;border-top:1px solid #dce5f0}.gift-export-footer strong{display:block;font-size:14px}.gift-export-footer span{display:block;font-size:11px;color:#66778b;margin-top:2px}.gift-export-social{font-size:11px;font-weight:800;color:#0b4f9f;text-align:right}.gift-export-disclaimer{font-size:8.5px;line-height:1.35;color:#7a8797;margin-top:7px}
`;
function buildGiftExportMarkup(s=state){const g=C.buildGift(s),name=String(s.clientName||'').trim();return `<div class="gift-export-page"><div class="gift-export-content"><div class="gift-export-meta">${new Date().toLocaleDateString('ru-RU')}</div><h1 class="gift-export-title">${name?`${esc(name)}, практические рекомендации<br>по вашей карте`:'Практические рекомендации<br>по вашей карте'}</h1><p class="gift-export-subtitle">Персональные шаги на основе введённых данных и выбранных приоритетов.</p>${g.html}<div class="gift-export-footer"><div><strong>Валентин Лебединский</strong><span>финансовый консультант</span></div><div class="gift-export-social">Telegram · Instagram · ВКонтакте &nbsp; @Lebedinsky_VA</div></div><div class="gift-export-disclaimer">Материал носит информационный характер и не является индивидуальной инвестиционной, страховой, медицинской или юридической рекомендацией.</div></div></div>`}
async function buildGiftPngBlob(s=state){const host=document.createElement('div');host.setAttribute('aria-hidden','true');host.style.cssText='position:fixed;left:-20000px;top:0;width:'+GIFT_EXPORT_WIDTH+'px;height:'+GIFT_EXPORT_HEIGHT+'px;overflow:hidden;pointer-events:none;opacity:0.001;z-index:-1';host.innerHTML=`<style>${GIFT_EXPORT_CSS}</style>${buildGiftExportMarkup(s)}`;document.body.appendChild(host);try{const page=host.querySelector('.gift-export-page'),content=host.querySelector('.gift-export-content');const contentHeight=Math.max(content.scrollHeight,content.getBoundingClientRect().height),availableW=GIFT_EXPORT_WIDTH-GIFT_EXPORT_MARGIN*2,availableH=GIFT_EXPORT_HEIGHT-GIFT_EXPORT_MARGIN*2;const fitScale=Math.min(availableW/GIFT_EXPORT_CONTENT_WIDTH,availableH/contentHeight,1.08);const scaledW=GIFT_EXPORT_CONTENT_WIDTH*fitScale;content.style.transform=`scale(${fitScale})`;content.style.left=`${(GIFT_EXPORT_WIDTH-scaledW)/2}px`;content.style.top=`${GIFT_EXPORT_MARGIN}px`;const pageHtml=page.outerHTML.replaceAll('&nbsp;','&#160;').replace(/<br\s*\/?>/gi,'<br/>');const xhtml=`<div xmlns="http://www.w3.org/1999/xhtml"><style>${GIFT_EXPORT_CSS}</style>${pageHtml}</div>`;const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${GIFT_EXPORT_WIDTH}" height="${GIFT_EXPORT_HEIGHT}" viewBox="0 0 ${GIFT_EXPORT_WIDTH} ${GIFT_EXPORT_HEIGHT}"><foreignObject x="0" y="0" width="100%" height="100%">${xhtml}</foreignObject></svg>`;const img=await imageFromUrl('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)),canvas=document.createElement('canvas');canvas.width=GIFT_EXPORT_WIDTH*GIFT_EXPORT_SCALE;canvas.height=GIFT_EXPORT_HEIGHT*GIFT_EXPORT_SCALE;const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.scale(GIFT_EXPORT_SCALE,GIFT_EXPORT_SCALE);ctx.drawImage(img,0,0,GIFT_EXPORT_WIDTH,GIFT_EXPORT_HEIGHT);return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Браузер не смог сформировать PNG рекомендаций')),'image/png'))}finally{host.remove()}}
async function downloadGift(){try{collect();notify('Готовим рекомендации в PNG…');const blob=await buildGiftPngBlob(state);const safeName=String(state.clientName||'Клиент').trim().replace(/[\\/:*?"<>|]+/g,'-');downloadBlob(`Персональные-рекомендации-${safeName}.png`,blob,'image/png');notify('Рекомендации сохранены в PNG')}catch(e){console.error('downloadGift failed',e);notify('Не удалось скачать рекомендации. Попробуйте ещё раз.')}}
function copyBrief(){const text=C.generateOwnerBrief(state);if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>notify('Briefing скопирован')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();notify('Briefing скопирован')}
function downloadBrief(){downloadBlob(`SALES-brief-${state.sessionId}.txt`,C.generateOwnerBrief(state));notify('Briefing сохранён')}
function newSession(){if(!confirm('Начать новую диагностику? Текущие данные будут очищены.'))return;clearDraft();state=C.normalizeState({sessionId:newId(),createdAt:now(),updatedAt:now()});current='start';history=[];render()}


nextBtn.addEventListener('click',goNext);backBtn.addEventListener('click',goBack);
window.downloadClientMap=downloadClientMap;window.downloadGift=downloadGift;window.buildGiftPngBlob=buildGiftPngBlob;window.buildClientMapPngBlob=buildClientMapPngBlob;window.copyBrief=copyBrief;window.downloadBrief=downloadBrief;window.newSession=newSession;window.syncToGoogle=syncToGoogle;window.buildSyncPayload=buildSyncPayload;
render();setTimeout(offerDraftResume,0);
</script>
</body></html>
